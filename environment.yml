# Python for Data Science — M2 Course
# Create with: conda env create -f environment.yml
# Activate with: conda activate ds-course

name: ds-course
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - numpy>=1.24
  - pandas>=2.0
  - matplotlib>=3.7
  - seaborn>=0.12
  - scipy>=1.10
  - requests>=2.28
  - jupyter>=1.0
  - ipykernel>=6.0
